spring.application.name=taller-mecanico
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/taller_mecanico?createDatabaseIfNotExist=true&connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
taller.admin.usuario=${ADMIN_USER:admin}
taller.admin.clave=${ADMIN_PASSWORD:}
taller.demo=${DEMO_DATA:false}
