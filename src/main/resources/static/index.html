<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Taller | Gestión de operaciones</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
  <script src="/app.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <section id="acceso" class="container py-5 d-print-none">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="text-center mb-4"><span class="badge text-bg-warning mb-3">SERVICIO AUTOMOTRIZ</span><h1 class="h2 fw-bold text-uppercase">Taller mecánico</h1><p class="text-body-secondary">Recepción · Mecánica · Bodega · Administración</p></div>
        <div class="card shadow-sm border-top border-warning border-4 rounded-0"><div class="card-body p-4">
          <form id="login">
            <h2 class="h4 mb-3">Iniciar sesión</h2>
            <p class="text-body-secondary">Ingresa con el usuario asignado por el administrador.</p>
            <label class="form-label" for="username">Usuario</label><input class="form-control mb-3" id="username" name="username" autocomplete="username" required maxlength="60" autofocus>
            <label class="form-label" for="password">Contraseña</label><input class="form-control mb-3" id="password" name="password" type="password" autocomplete="current-password" required>
            <p id="error-login" role="alert" class="text-danger"></p>
            <button class="btn btn-warning fw-semibold w-100" type="submit">Ingresar</button>
          </form>
        </div></div>
      </div>
    </div>
  </section>
  <div id="aplicacion" class="d-print-none" hidden>
    <div class="container-fluid">
      <div class="row min-vh-100">
        <aside id="panel-lateral" class="offcanvas-lg offcanvas-start col-lg-3 col-xl-2 bg-dark text-white border-end border-secondary p-0" tabindex="-1" aria-labelledby="marca-taller" data-bs-theme="dark">
          <div class="offcanvas-header border-bottom border-secondary">
            <span class="text-warning fw-bold">MENÚ DEL TALLER</span>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#panel-lateral" aria-label="Cerrar menú"></button>
          </div>
          <div class="offcanvas-body d-flex flex-column p-3 p-xl-4">
            <a class="text-white text-decoration-none d-block border-bottom border-secondary pb-4 mb-4" href="/">
              <svg class="text-warning mb-3" width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 6.5a6.5 6.5 0 0 1-8.9 6L5.7 20a3 3 0 0 1-4.2-4.2l7.4-7.4A6.5 6.5 0 0 1 17.5.5L13 5l1 4 4 1 4.5-4.5c.1.3.1.7.1 1Z"/></svg>
              <strong id="marca-taller" class="d-block text-uppercase fs-5 text-break">TALLER MECÁNICO</strong>
              <span class="small text-white-50">Gestión de servicio automotriz</span>
            </a>
            <p class="small text-warning fw-semibold text-uppercase">Área de operaciones</p>
            <nav id="navegacion" class="d-grid gap-2 mb-4" aria-label="Secciones"></nav>
            <div class="mt-auto border-top border-secondary pt-3">
              <strong id="nombre-usuario" class="d-block text-break"></strong>
              <span id="rol-usuario" class="badge text-bg-secondary my-2"></span>
              <button id="salir" class="btn btn-outline-light btn-sm w-100 mt-2">Cerrar sesión</button>
            </div>
          </div>
        </aside>
        <main class="col-lg-9 col-xl-10 p-3 p-lg-4">
          <button class="btn btn-dark d-lg-none mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#panel-lateral" aria-controls="panel-lateral">☰ Menú del taller</button>
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4"><div><p class="text-body-secondary small mb-1">CONTROL DE SERVICIO · TALLER MECÁNICO</p><h1 id="titulo" class="h3 fw-bold mb-0">Órdenes de trabajo</h1></div><span id="fecha-hoy" class="text-body-secondary"></span></div>
      <div id="mensaje" role="status" aria-live="polite" hidden></div>
      <section id="contenido" aria-label="Contenido de la sección"></section>
        </main>
      </div>
    </div>
  </div>
  <div id="modal" class="modal d-print-none" tabindex="-1" aria-labelledby="titulo-modal" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header border-bottom border-warning border-3"><h2 id="titulo-modal" class="modal-title fs-5"></h2><button id="cerrar-modal" type="button" class="btn-close" aria-label="Cerrar ventana"></button></div>
      <div id="cuerpo-modal" class="modal-body"></div>
    </div></div>
  </div>
  <section id="comprobante-impresion" class="d-none d-print-block"></section>
</body>
</html>
